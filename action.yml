# action.yml

name: minio-download
description: "Action that lets you download objects from a MinIO server"
inputs:
  url:
    description: "URL of the MinIO server"
    required: true
  access-key:
    description: "Access Key for the MinIO server"
    required: true
  secret-key:
    description: "Secret Key for the MinIO server"
    required: true
  local-path:
    description: 'Path of the local object'
    required: true
    default: './'
  remote-path:
    description: 'Path to remote object'
    required: true

runs:
  using: composite
  steps:
    - name: Check if mc is installed
      id: check-mc
      run: |
        if [[ -n "$(which mc)" ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Download latest mc SHA256
      id: mc-sha
      if: ${{ steps.check-mc.outputs.exists == 'false' }}
      run: |
        arch=$(dpkg --print-architecture | sed 's/armhf/arm/g')
        sha=$(wget -qO- \
          https://dl.min.io/client/mc/release/linux-"${arch}"/mc.sha256sum \
          | awk '{print $1}')
        echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache mc binary
      id: cache-mc
      if: ${{ steps.check-mc.outputs.exists == 'false' }}
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/mc
        key: mc-${{ steps.mc-sha.outputs.sha256 }}

    - name: Setup mc
      working-directory: /usr/local/bin
      if: >-
        ${{ steps.check-mc.outputs.exists == 'false'
          && steps.cache-mc.outputs.cache-hit != 'true' }}
      run: |
        arch=$(dpkg --print-architecture | sed 's/armhf/arm/g')
        sudo wget --progres=dot:binary \
          "https://dl.min.io/client/mc/release/linux-${arch}/mc"
        sudo chmod +x mc
      shell: bash

    - name: Setup s3 alias
      run: |
        mc alias set s3 "${{ inputs.url }}" \
          "${{ inputs.access-key }}" "${{ inputs.secret-key }}"
      shell: bash

    - name: Download objects
      run: |
        echo "Will download ${{ inputs.remote-path }} to ${{ inputs.local-path }}"
        remote_path=${{ inputs.remote-path }}
        if [ "${remote_path#*'*'}" != "$remote_path" ]; then
          # Handle remote_files with wildcards 
          remote_dir=$(dirname "$remote_path")
          remote_files=$(basename "$remote_path")
          IFS=$'\n'
          for p in $(mc find "s3/$remote_dir" \
            --maxdepth 2 --name "$remote_files" | sort -u); do
              mc cp -r "$p" "${{ inputs.local-path }}";
          done
          unset IFS
        else
          mc cp -r "s3/$remote_path" "${{ inputs.local-path }}"
        fi
      shell: bash
